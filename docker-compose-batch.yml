version: '3.8'

services:
  batch-converter:
    build: .
    container_name: md-batch-converter
    volumes:
      - ./markdown:/app/markdown:ro
      - ./images:/app/images:ro
      - ./dist:/app/dist
      - /tmp/conversion_images:/tmp/conversion_images
      - ./images:/home/memz/Repos/Oficina-Movil-Fibex/docs/images:ro
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command: python batch_converter.py --markdown-dir /app/markdown --images-dir /app/images --output-dir /app/dist
    networks:
      - default

  # Interactive shell for batch conversion testing
  batch-converter-shell:
    build: .
    container_name: md-batch-converter-shell
    volumes:
      - ./markdown:/app/markdown:ro
      - ./images:/app/images:ro
      - ./dist:/app/dist
      - /tmp/conversion_images:/tmp/conversion_images
      - ./images:/home/memz/Repos/Oficina-Movil-Fibex/docs/images:ro
      - .:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /app
    stdin_open: true
    tty: true
    command: /bin/bash
    profiles:
      - shell
